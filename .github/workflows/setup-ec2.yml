name: Setup KAWA EC2

on:
  workflow_dispatch:
    inputs:
      front_domain:
        description: Frontend DEV domain
        required: true
        default: dev.kawa-retail.com
      api_domain:
        description: Customer API DEV domain
        required: true
        default: api-dev.kawa-retail.com

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Send bootstrap script through SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          FRONT_DOMAIN: ${{ inputs.front_domain }}
          API_DOMAIN: ${{ inputs.api_domain }}
        run: |
          set -euo pipefail
          export SCRIPT_B64="$(base64 -w 0 infra/setup-server.sh)"

          python3 - <<'PY'
          import json, os
          payload = {
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": [os.environ["INSTANCE_ID"]],
              "Comment": "Bootstrap KAWA EC2",
              "Parameters": {"commands": [
                  "mkdir -p /opt/kawa/bootstrap",
                  f"echo '{os.environ['SCRIPT_B64']}' | base64 -d > /opt/kawa/bootstrap/setup-server.sh",
                  "chmod +x /opt/kawa/bootstrap/setup-server.sh",
                  f"/opt/kawa/bootstrap/setup-server.sh '{os.environ['FRONT_DOMAIN']}' '{os.environ['API_DOMAIN']}'"
              ]}
          }
          with open('/tmp/ssm-command.json','w',encoding='utf-8') as f:
              json.dump(payload,f)
          PY

          COMMAND_ID="$(aws ssm send-command --cli-input-json file:///tmp/ssm-command.json --query 'Command.CommandId' --output text)"
          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 180); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || true)"
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
                exit 1 ;;
            esac
            sleep 5
          done

          FINAL_STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)"
          [[ "$FINAL_STATUS" == "Success" ]] || { echo "Bootstrap failed: $FINAL_STATUS"; exit 1; }

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
