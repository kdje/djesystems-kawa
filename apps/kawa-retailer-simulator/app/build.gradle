import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Secrets/configuration de test uniquement.
// Le fichier local.properties est volontairement hors Git.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def localProp = { String key, String defaultValue = '' ->
    localProperties.getProperty(key, defaultValue)
}

def buildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.djesystems.kawa.retailersimulator'
    compileSdk 36

    defaultConfig {
        applicationId 'com.djesystems.kawa.retailersimulator'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1'

        buildConfigField 'String', 'KAWA_TENANT_ID', buildConfigString(localProp('KAWA_TENANT_ID'))
        buildConfigField 'String', 'KAWA_WALLET_SCOPE', buildConfigString(localProp('KAWA_WALLET_SCOPE'))
        buildConfigField 'String', 'KAWA_WALLET_BASE_URL', buildConfigString(
            localProp('KAWA_WALLET_BASE_URL', 'https://api-dev.kawa-retail.com')
        )

        buildConfigField 'String', 'AUCHAN_CLIENT_ID', buildConfigString(localProp('AUCHAN_CLIENT_ID'))
        buildConfigField 'String', 'AUCHAN_CLIENT_SECRET', buildConfigString(localProp('AUCHAN_CLIENT_SECRET'))
        buildConfigField 'String', 'CARREFOUR_CLIENT_ID', buildConfigString(localProp('CARREFOUR_CLIENT_ID'))
        buildConfigField 'String', 'CARREFOUR_CLIENT_SECRET', buildConfigString(localProp('CARREFOUR_CLIENT_SECRET'))
        buildConfigField 'String', 'CORA_CLIENT_ID', buildConfigString(localProp('CORA_CLIENT_ID'))
        buildConfigField 'String', 'CORA_CLIENT_SECRET', buildConfigString(localProp('CORA_CLIENT_SECRET'))
        buildConfigField 'String', 'LIDL_CLIENT_ID', buildConfigString(localProp('LIDL_CLIENT_ID'))
        buildConfigField 'String', 'LIDL_CLIENT_SECRET', buildConfigString(localProp('LIDL_CLIENT_SECRET'))
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
