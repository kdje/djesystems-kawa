server {
    listen 80;

    location = /health {
        access_log off;
        return 200 "UP";
        add_header Content-Type text/plain;
    }

    location = /retailer-portal {
        return 301 /retailer-portal/;
    }

    # The API hostname serves the portal under a dedicated path. Strip the
    # prefix before forwarding so Nginx can serve the SPA at its document root.
    location ^~ /retailer-portal/ {
        proxy_pass http://kawa-retailer-portal:80/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/customers/ {
        proxy_pass http://customer-service:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/wallet/ {
        proxy_pass http://wallet-service:8082;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin/ {
        proxy_pass http://retailer-service:8083;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Retailer portal Firebase-authenticated APIs.
    location ^~ /api/retailer-portal/ {
        proxy_pass http://retailer-service:8083;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ne jamais exposer /internal/**
    location /internal/ {
        return 404;
    }
}
