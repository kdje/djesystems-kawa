server {
 listen 80;
 location /api/v1/customers/ { proxy_pass http://customer-service:8081; }
 location /api/v1/wallet/ { proxy_pass http://wallet-service:8082; }
 location /api/v1/retailers { proxy_pass http://retailer-service:8083; }
 location /partner/ { proxy_pass http://partner-service:8084; }
 # Never expose /internal/** through the public gateway.
}
