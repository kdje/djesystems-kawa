server:
  port: 8083

spring:
  config:
    import: optional:file:../../.env.local[.properties]

  application:
    name: retailer-service

  datasource:
    url: ${RETAILER_DB_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KAWA_ENTRA_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info

kawa:
  security:
    issuer-uri: ${KAWA_ENTRA_ISSUER_URI}
    audience: ${RETAILER_SERVICE_CLIENT_ID}

  retailer-portal:
    firebase:
      project-id: ${KAWA_FIREBASE_PROJECT_ID}
    cors:
      allowed-origins: ${KAWA_RETAILER_PORTAL_CORS_ORIGINS:http://localhost:5174}

  azure:
    tenant-id: ${AZURE_TENANT_ID}
    client-id: ${RETAILER_SERVICE_CLIENT_ID}
    client-secret: ${RETAILER_SERVICE_CLIENT_SECRET}

    service-bus:
      fully-qualified-namespace: ${AZURE_SERVICEBUS_FULLY_QUALIFIED_NAMESPACE}
      topic: ${RETAILER_SERVICE_TOPIC}

  outbox:
    publication-delay-ms: 2000